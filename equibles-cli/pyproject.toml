[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equibles-cli"
version = "0.1.0"
description = "CLI for querying the local Equibles ParadeDB instance — outputs structured JSON for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "psycopg2-binary>=2.9",
    "tabulate>=0.9",
]

[project.scripts]
equibles = "equibles_cli.cli:main"

[tool.setuptools.packages.find]
include = ["equibles_cli*"]
